
name: "🐛 버그 신고"
description: "발견한 오류를 등록합니다."
title: "[Fix] "
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: "버그 설명"
      description: "어떤 문제가 발생했나요?"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "수정한 결과"
      placeholder: "버그 해결한 결과에 대해 설명해주세요"

  - type: textarea
    id: environment
    attributes:
      label: "실행 환경"
      placeholder: "예: Chrome, Windows 11"

  - type: textarea
    id: screenshots
    attributes:
      label: "스크린샷 및 로그"
      description: "API Key 등 민감한 정보는 제거해주세요."
