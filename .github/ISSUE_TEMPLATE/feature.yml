
name: "✨ 기능 개발"
description: "새로운 기능을 개발할 때 사용합니다."
title: "[Feat] "
labels: ["feature"]
body:
  - type: input
    id: feature-id
    attributes:
      label: "기능 번호"
      description: "기획서의 기능 번호를 작성해주세요."
      placeholder: "예: F7 - AI 표지 생성"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "기능 설명"
      description: "구현할 기능을 설명해주세요."
      placeholder: "어떤 기능을 구현할 예정인가요?"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "작업 목록"
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
        - [ ] 작업 3
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건"
      placeholder: "어떤 상태가 되면 완료인가요?"
    validations:
      required: true
